name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies (mdparser)
        run: npm --prefix mdparser ci

      - name: Install dependencies (website)
        run: npm --prefix website ci

      - name: Install dependencies (scripts)
        run: npm --prefix scripts ci

      - name: Run format check
        run: ./format.sh --check

      - name: Run test suite
        run: ./test.sh
