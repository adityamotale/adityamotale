name: Activity

on:
  schedule:
    - cron: '30 2 * * *' # 08:00 AM IST (02:30 UTC) every day
  workflow_dispatch:
    inputs:
      mode:
        description: 'Fetch mode'
        type: choice
        options:
          - last-7-days
          - last-week
          - custom-range
          - full-backfill
        default: last-7-days
      days:
        description: 'Days to fetch (if custom-range selected)'
        required: false
        default: '7'
      from:
        description: 'Start date (YYYY-MM-DD, if custom-range selected)'
        required: false
        default: ''
      to:
        description: 'End date (YYYY-MM-DD, if custom-range selected)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies (mdparser)
        run: npm --prefix mdparser ci

      - name: Install dependencies (website)
        run: npm --prefix website ci

      - name: Install dependencies (scripts)
        run: npm --prefix scripts ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run GitHub activity & stats collector
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ARGS=()

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "last-7-days" ]; then
            ARGS+=(--days 7)
          elif [ "${{ inputs.mode }}" = "last-week" ]; then
            ARGS+=(--last-week)
          elif [ "${{ inputs.mode }}" = "full-backfill" ]; then
            ARGS+=(--full-backfill)
          elif [ -n "${{ inputs.from }}" ] && [ -n "${{ inputs.to }}" ]; then
            ARGS+=(--from "${{ inputs.from }}" --to "${{ inputs.to }}")
          elif [ -n "${{ inputs.days }}" ]; then
            ARGS+=(--days "${{ inputs.days }}")
          else
            ARGS+=(--days 7)
          fi

          echo "Running: node scripts/fetch-github-stats.ts ${ARGS[*]}"
          node scripts/fetch-github-stats.ts "${ARGS[@]}"

      - name: Commit stats data
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "(data) update github activity stats [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Run update README script
        run: node scripts/generate-readme.ts

      - name: Commit README and assets
        run: |
          git add README.md assets/icons/
          if git diff --staged --quiet; then
            echo "No README or asset changes to commit"
          else
            git commit -m "(readme) update readme and activity metrics [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Build static site
        run: npm --prefix website run build

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy website/dist --project-name=adii --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
