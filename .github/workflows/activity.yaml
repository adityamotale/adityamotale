name: Activity

on:
  schedule:
    - cron: '0 2 * * 1' # 0200 UTC every Monday
  workflow_dispatch:
    inputs:
      mode:
        description: 'Fetch mode'
        type: choice
        options:
          - last-week
          - custom-range
          - full-backfill
        default: last-week
      days:
        description: 'Days to fetch (if custom-range selected)'
        required: false
        default: '7'
      from:
        description: 'Start date (YYYY-MM-DD, if custom-range selected)'
        required: false
        default: ''
      to:
        description: 'End date (YYYY-MM-DD, if custom-range selected)'
        required: false
        default: ''
      force_release:
        description: 'Force version bump and release even if stats have not changed'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies (mdparser)
        run: npm --prefix mdparser ci

      - name: Install dependencies (website)
        run: npm --prefix website ci

      - name: Install dependencies (scripts)
        run: npm --prefix scripts ci

      - name: Run GitHub activity & stats collector
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ARGS=()

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "last-week" ]; then
            ARGS+=(--last-week)
          elif [ "${{ inputs.mode }}" = "full-backfill" ]; then
            ARGS+=(--full-backfill)
          elif [ -n "${{ inputs.from }}" ] && [ -n "${{ inputs.to }}" ]; then
            ARGS+=(--from "${{ inputs.from }}" --to "${{ inputs.to }}")
          elif [ -n "${{ inputs.days }}" ]; then
            ARGS+=(--days "${{ inputs.days }}")
          else
            ARGS+=(--last-week)
          fi

          echo "Running: node scripts/fetch-github-stats.ts ${ARGS[*]}"
          node scripts/fetch-github-stats.ts "${ARGS[@]}"

      - name: Bump version, update changelog & trigger release tag
        run: |
          EXTRA_ARGS=()
          if [ "${{ inputs.force_release }}" = "true" ]; then
            EXTRA_ARGS+=(--force)
          fi
          node scripts/bump-version.ts "${EXTRA_ARGS[@]}"
