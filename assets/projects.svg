<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 130" width="100%" height="130" fill="none">
  <style>
    
  .mono {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
  }
  .accent { fill: #d7827e; font-weight: 600; }
  .text { fill: #575279; font-weight: 500; }
  .subtle { fill: #797593; font-weight: 400; }
  .muted { fill: #9893a5; font-weight: 400; }
  .pine { fill: #286983; font-weight: 700; }
  .foam { fill: #56949f; font-weight: 700; }
  .gold { fill: #ea9d34; font-weight: 700; }
  .love { fill: #b4637a; font-weight: 700; }
  .bar-empty { fill: #dfdad9; }
  .header-line { stroke: #dfdad9; }

  @media (prefers-color-scheme: dark) {
    .accent { fill: #ea9a97; }
    .text { fill: #e0def4; }
    .subtle { fill: #908caa; }
    .muted { fill: #6e6a86; }
    .pine { fill: #3e8fb0; }
    .foam { fill: #9ccfd8; }
    .gold { fill: #f6c177; }
    .love { fill: #eb6f92; }
    .bar-empty { fill: #44415a; }
    .header-line { stroke: #44415a; }
  }

  </style>
  <g class="mono" font-size="11.5">
    <text x="0" y="14" class="accent" font-size="12">&gt;</text>
    <text x="12" y="14" class="text" font-size="11" font-weight="700" letter-spacing="0.06em">PROJECTS</text>
    <line x1="85" y1="10" x2="680" y2="10" class="header-line" stroke-width="1" />

    <text x="0" y="36">
      <tspan class="text" font-weight="600">turbofox      </tspan> <tspan class="muted">—</tspan> <tspan class="subtle">A persistent and efficient embedded KV database</tspan>
    </text>
    <text x="0" y="56">
      <tspan class="text" font-weight="600">frozen-core   </tspan> <tspan class="muted">—</tspan> <tspan class="subtle">Core utilities for frozen codebases.</tspan>
    </text>
    <text x="0" y="76">
      <tspan class="text" font-weight="600">ashwa         </tspan> <tspan class="muted">—</tspan> <tspan class="subtle">Hardware accelerated routines for single substring search.</tspan>
    </text>
    <text x="0" y="96">
      <tspan class="text" font-weight="600">kosa          </tspan> <tspan class="muted">—</tspan> <tspan class="subtle">A reliable page-based storage engine with fire-and-forget durability semantics</tspan>
    </text>
    <text x="0" y="116">
      <tspan class="text" font-weight="600">anvaya        </tspan> <tspan class="muted">—</tspan> <tspan class="subtle">Fast and lightweight Sanskrit lexical and syntactic analyzer</tspan>
    </text>
  </g>
</svg>