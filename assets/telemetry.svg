<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 135" width="100%" height="135" fill="none">
  <style>
    
  .mono {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
  }
  .accent { fill: #d7827e; font-weight: 600; }
  .text { fill: #575279; font-weight: 500; }
  .subtle { fill: #797593; font-weight: 400; }
  .muted { fill: #9893a5; font-weight: 400; }
  .pine { fill: #286983; font-weight: 700; }
  .foam { fill: #56949f; font-weight: 700; }
  .gold { fill: #ea9d34; font-weight: 700; }
  .love { fill: #b4637a; font-weight: 700; }
  .bar-empty { fill: #dfdad9; }
  .header-line { stroke: #dfdad9; }

  @media (prefers-color-scheme: dark) {
    .accent { fill: #ea9a97; }
    .text { fill: #e0def4; }
    .subtle { fill: #908caa; }
    .muted { fill: #6e6a86; }
    .pine { fill: #3e8fb0; }
    .foam { fill: #9ccfd8; }
    .gold { fill: #f6c177; }
    .love { fill: #eb6f92; }
    .bar-empty { fill: #44415a; }
    .header-line { stroke: #44415a; }
  }

  </style>
  <g class="mono" font-size="11.5">
    <text x="0" y="14" class="accent" font-size="12">&gt;</text>
    <text x="12" y="14" class="text" font-weight="700" letter-spacing="0.06em">TELEMETRY</text>
    <line x1="91.5" y1="10" x2="680" y2="10" class="header-line" stroke-width="1" />

    <text x="14" y="38" class="muted" font-size="11">// counts</text>
    <text x="340" y="38" class="muted" font-size="11">// activity</text>

    <!-- Row 1: loc & prs -->
    <text x="14" y="58">
      <tspan class="subtle">loc</tspan><tspan class="muted">     : </tspan><tspan class="text" font-weight="600">697,167</tspan> <tspan class="muted text-xs">(+1.6M / -900.3k)</tspan>
    </text>
    <text x="340" y="58">
      <tspan class="subtle">prs</tspan><tspan class="muted">    : [</tspan><tspan class="foam">███████████████</tspan><tspan class="bar-empty">░</tspan><tspan class="muted">] </tspan><tspan class="text" font-weight="600">97.4%</tspan>
    </text>

    <!-- Row 2: commits & active -->
    <text x="14" y="78">
      <tspan class="subtle">commits</tspan><tspan class="muted"> : </tspan><tspan class="text" font-weight="600">3,515</tspan> <tspan class="muted text-xs">(pub + org)</tspan>
    </text>
    <text x="340" y="78">
      <tspan class="subtle">active</tspan><tspan class="muted"> : [</tspan><tspan class="gold">███████</tspan><tspan class="bar-empty">░░░░░░░░░</tspan><tspan class="muted">] </tspan><tspan class="text" font-weight="600">48.2%</tspan>
    </text>

    <!-- Row 3: repos & streak -->
    <text x="14" y="98">
      <tspan class="subtle">repos</tspan><tspan class="muted">   : </tspan><tspan class="text" font-weight="600">53</tspan> <tspan class="muted text-xs">(18 pub · 10 pri · 25 org)</tspan>
    </text>
    <text x="340" y="98">
      <tspan class="subtle">streak</tspan><tspan class="muted"> : </tspan><tspan class="text" font-weight="600">12d</tspan> <tspan class="muted text-xs">current (112d max)</tspan>
    </text>

    <!-- Row 4: stack & churn -->
    <text x="14" y="118">
      <tspan class="subtle">stack</tspan><tspan class="muted">   : </tspan><tspan class="text" font-weight="600">Rust 73% · TypeScript 8% · Assembly 4%</tspan>
    </text>
    <text x="340" y="118">
      <tspan class="subtle">churn</tspan><tspan class="muted">  : </tspan><tspan class="text" font-weight="600">64.0%</tspan> <tspan class="muted text-xs">net retention</tspan>
    </text>
  </g>
</svg>